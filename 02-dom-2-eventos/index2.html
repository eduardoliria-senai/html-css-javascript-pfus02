<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: normal 24px Arial;
        }
        button,input {
            font: normal 24px Arial;
            width: 100px;
        }

        #paragrafo {
            color: red;
        }
        #res {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Somando Valores</h1>
    <input type="number" id="numero1">
    <input type="number" id="numero2">
    <button id="botaoSomar">Somar</button>
    <div id="res">Resultado</div>

    <script>
        // variaveis 
        let numero1 = document.querySelector('#numero1')
        let numero2 = document.querySelector('#numero2')
        let botaoSomar = document.querySelector('#botaoSomar')
        let res = document.querySelector('#res')

        // FUNCAO 
        function somarNumeros() {
            // convertendo para numero
            let n1 = Number(numero1.value)
            let n2 = Number(numero2.value)
            // criando a variavel para somar
            let soma = n1 + n2 
            res.innerHTML = "<p id='paragrafo'>A soma é </p>" + soma
        }

        // adicionando o EVENTO
        botaoSomar.addEventListener('click', somarNumeros)
    </script>
</body>
</html>
